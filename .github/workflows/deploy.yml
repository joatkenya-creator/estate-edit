name: Deploy to Cloudflare

# Auto-deploy the site whenever changes land on main (or run manually).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run deploy` = opennextjs-cloudflare build (runs `next build --webpack`,
      # which is REQUIRED here) && opennextjs-cloudflare deploy.
      - name: Build and deploy
        run: npm run deploy
        env:
          # Build-time — inlined into the bundle. If missing, the app ships with
          # an undefined Supabase client and 500s on every route.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          # Paystack's public key is NOT needed here — it is read at runtime
          # from the Worker secret PAYSTACK_PUBLIC_KEY (see lib/paystack-key.ts)
          # so a missing build secret can no longer silently break "Pay".
          NEXT_PUBLIC_GOOGLE_ADS_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ADS_ID }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID }}
          # Wrangler auth for the deploy step. Runtime Worker secrets
          # (SERVICE_ROLE, RESEND, NOTIFY_SECRET, MPESA_*, AT_*) are set once via
          # `wrangler secret put` and persist across deploys — not needed here.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
